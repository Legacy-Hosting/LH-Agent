name: Agent Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      RELEASE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: service
          fetch-depth: 0
      - name: Verify immutable release ref
        working-directory: service
        shell: bash
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          tag_ref="refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$tag_ref")" = tag
          tag_commit=$(git rev-list -n 1 "$tag_ref")
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tag_commit" FETCH_HEAD
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
      - name: Check out LH-Releases
        if: env.RELEASES_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: Legacy-Hosting/LH-Releases
          token: ${{ env.RELEASES_TOKEN }}
          path: releases
          lfs: true
      - name: Prepare local release artifact
        if: env.RELEASES_TOKEN == ''
        run: mkdir releases && git -C releases init
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: service/pnpm-lock.yaml
      - name: Verify and build
        working-directory: service
        run: |
          pnpm install --frozen-lockfile
          bash -n ops/scripts/*.sh
          shellcheck --severity=error ops/scripts/*.sh
          pnpm test
          pnpm typecheck
          pnpm build
      - name: Build immutable release
        shell: bash
        run: |
          test -n "$RELEASE_SIGNING_PRIVATE_KEY_B64"
          SIGNING_KEY=$(mktemp)
          trap 'rm -f -- "$SIGNING_KEY"' EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY_B64" | base64 --decode > "$SIGNING_KEY"
          chmod 0600 "$SIGNING_KEY"
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_SIGNING_PRIVATE_KEY_FILE="$SIGNING_KEY" \
            service/ops/scripts/build-release.sh "$VERSION" "$GITHUB_WORKSPACE/releases"
      - name: Publish to LH-Releases
        if: env.RELEASES_TOKEN != ''
        working-directory: releases
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          git lfs install --local
          git config user.name "Legacy Hosting Releases"
          git config user.email "releases@legacyhosting.xyz"
          git add LH-Agent
          git commit -m "release: LH-Agent ${RELEASE_VERSION#v}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Retain release for manual publication
        if: env.RELEASES_TOKEN == ''
        uses: actions/upload-artifact@v6
        with:
          name: LH-Agent-${{ github.ref_name }}
          path: releases/LH-Agent
          if-no-files-found: error
          retention-days: 7
